<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://api.open-meteo.com; img-src 'self' data:;">
<title>LandslejrVejr</title>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --p1:#5c3d54; --p2:#854232; --p3:#4c542b;
  --dark:#2a1f1a; --mid:#785716;
  --grey:#7D878C; --bg:#f5f0e8; --card:#fdfaf4; --card2:#ede7d6;
  --border:rgba(42,31,26,.1);
}
body{font-family:'Work Sans',sans-serif;background:var(--bg);color:var(--dark);min-height:100vh}
.shell{max-width:680px;margin:0 auto;padding:0 1rem 5rem}

/* header */
header{padding:1.3rem 0 1rem;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid rgba(42,31,26,.14);margin-bottom:1.2rem}
.logo{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;background:var(--dark);color:#fff;font-size:11px;font-weight:800;clip-path:polygon(0 0,100% 0,100% 70%,50% 100%,0 70%);flex-shrink:0}
.site-name{font-size:18px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.site-sub{font-size:11px;color:var(--grey);margin-top:2px}
.updated{font-size:11px;color:var(--grey);font-family:'DM Mono',monospace}

/* legend */
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:1rem}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--grey)}
.leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* loading */
.state{text-align:center;padding:4rem 0}
.state h2{font-size:17px;font-weight:700;margin-bottom:.4rem}
.state p{font-size:13px;color:var(--grey)}
.spinner{width:26px;height:26px;border:2px solid rgba(42,31,26,.15);border-top-color:var(--mid);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto .8rem}
@keyframes spin{to{transform:rotate(360deg)}}

/* days */
.days{display:flex;flex-direction:column;gap:5px}
.day-card{background:var(--card);border:1.5px solid var(--border);border-radius:14px;overflow:hidden;transition:border-color .15s}
.day-card.open{border-color:var(--mid)}

/* day header row */
.day-head{padding:.7rem .9rem;cursor:pointer;display:grid;grid-template-columns:1fr 30px 80px 18px;align-items:center;gap:8px}
.day-head:hover{background:rgba(42,31,26,.03)}
.day-card.open .day-head{background:rgba(120,87,22,.04)}
.dn{font-size:14px;font-weight:700}
.dn.today{color:var(--mid)}
.dd{font-size:11px;color:var(--grey);font-family:'DM Mono',monospace;margin-top:1px}
.di{font-size:21px;text-align:center}
.chev{font-size:11px;color:var(--grey);text-align:center;transition:transform .25s}
.day-card.open .chev{transform:rotate(180deg)}

/* rain summary strip — three points inline */
.rain-strip{display:flex;gap:6px;flex-wrap:wrap;padding:0 .9rem .65rem;margin-top:-2px}
.rs-item{display:flex;align-items:center;gap:4px;font-size:12px;font-family:'DM Mono',monospace}
.rs-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.rs-val{font-weight:600}
.rs-dry{color:var(--grey)}

/* expand */
.expand{overflow:hidden;max-height:0;transition:max-height .35s ease}
.day-card.open .expand{max-height:700px}
.exp-inner{padding:.8rem .9rem 1rem;border-top:1px solid rgba(42,31,26,.08)}
.exp-label{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--grey);margin-bottom:7px}

/* grouped bar chart — three bars per hour slot */
.chart-wrap{margin-bottom:4px}
.hour-group{display:flex;flex-direction:column;gap:2px}
.hg-row{display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid rgba(42,31,26,.05)}
.hg-row:last-child{border-bottom:none}
.hg-time{font-family:'DM Mono',monospace;font-size:11px;font-weight:600;min-width:40px;color:var(--dark)}
.hg-bars{flex:1;display:flex;flex-direction:column;gap:3px}
.hg-bar-row{display:flex;align-items:center;gap:6px}
.hg-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.hg-bar-bg{flex:1;height:7px;background:rgba(42,31,26,.07);border-radius:3px;overflow:hidden}
.hg-bar-fill{height:100%;border-radius:3px}
.hg-mm{font-family:'DM Mono',monospace;font-size:11px;min-width:40px;text-align:right}

/* no rain */
.no-rain{text-align:center;padding:.8rem 0;color:var(--grey);font-size:13px}

/* pills */
.pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.pill{background:rgba(120,87,22,.07);border:1px solid rgba(120,87,22,.15);border-radius:8px;padding:4px 9px;text-align:center}
.pill-l{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--grey);margin-bottom:2px}
.pill-v{font-family:'DM Mono',monospace;font-size:13px;font-weight:600}

@media(max-width:480px){
  .day-head{grid-template-columns:1fr 28px 70px 16px;gap:5px;padding:.65rem .7rem}
  .rain-strip{padding:0 .7rem .6rem}
}
</style>
</head>
<body>
<div class="shell">
<header>
  <div>
    <div class="site-name"><span class="logo">LV</span> LandslejrVejr</div>
    <div class="site-sub">Tre målepunkter · 12 dage frem</div>
  </div>
  <div class="updated" id="updated">—</div>
</header>
<div id="content"><div class="state"><div class="spinner"></div><h2>Henter vejrdata…</h2><p>Henter tre punkter parallelt</p></div></div>
</div>

<script>
const POINTS = [
  { id:'p1', label:'P1', lat:56.137010, lon:9.619222, color:'#5c3d54' },
  { id:'p2', label:'P2', lat:56.123954, lon:9.715591, color:'#854232' },
  { id:'p3', label:'P3', lat:56.117041, lon:9.658026, color:'#4c542b' },
];

const WMO = {0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',71:'🌨️',73:'🌨️',75:'❄️',77:'🌨️',80:'🌦️',81:'🌧️',82:'⛈️',85:'🌨️',86:'❄️',95:'⛈️',96:'⛈️',99:'⛈️'};
const DAYS = ['Søndag','Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag'];
const MONTHS = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];

const wmoIcon = c => WMO[c]||'🌡️';
const isToday = s => { const d=new Date(s),t=new Date(); return d.getDate()===t.getDate()&&d.getMonth()===t.getMonth()&&d.getFullYear()===t.getFullYear(); };
const rainDesc = mm => { if(!mm||mm<0.1)return'Tørt'; if(mm<0.5)return'Dug'; if(mm<2)return'Let regn'; if(mm<5)return'Regn'; if(mm<10)return'Kraftig'; return'Styrtregn'; };

let openIdx = 0;
let allData = null;

async function fetchPoint(pt, attempt=0) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${pt.lat}&longitude=${pt.lon}`
    + `&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max`
    + `&hourly=precipitation`
    + `&wind_speed_unit=ms&forecast_days=14&timezone=Europe%2FCopenhagen`;
  const r = await fetch(url);
  if (r.status === 429 && attempt < 3) {
    await new Promise(res => setTimeout(res, 1500 * (attempt+1)));
    return fetchPoint(pt, attempt+1);
  }
  if (!r.ok) throw new Error(`${pt.label}: API fejl ${r.status}`);
  return r.json();
}

const sleep = ms => new Promise(res => setTimeout(res, ms));

function buildExpand(dayIdx) {
  // Hourly average across all three points
  const avgHrs = Array.from({length:24}, (_,h) => {
    const vals = POINTS.map((_,pi) => allData[pi].hourly.precipitation[dayIdx*24+h]||0);
    return { h, mm: vals.reduce((s,v)=>s+v,0)/vals.length };
  });

  const wet = avgHrs.filter(x => x.mm >= 0.05);
  const hasRain = wet.length > 0;
  const maxMm = Math.max(...avgHrs.map(x=>x.mm), 0.5);

  const totals = POINTS.map((_,pi) => allData[pi].daily.precipitation_sum[dayIdx]);
  const avgTotal = totals.reduce((s,v)=>s+v,0)/totals.length;
  const prob = allData[0].daily.precipitation_probability_max[dayIdx];

  // Group consecutive wet hours
  const groups = [];
  wet.forEach(r => {
    const last = groups[groups.length-1];
    if (last && r.h - last[last.length-1].h <= 2) last.push(r);
    else groups.push([r]);
  });

  const chart = hasRain ? `
    <div class="exp-label">Nedbør · gennemsnit af tre punkter</div>
    <div class="hour-group">
      ${groups.map(grp => `
        ${grp.length>1?`<div style="font-size:10px;color:var(--grey);padding:4px 0 2px;font-family:'DM Mono',monospace">${String(grp[0].h).padStart(2,'0')}:00 – ${String(grp[grp.length-1].h).padStart(2,'0')}:59</div>`:''}
        ${grp.map(r=>`
        <div class="hg-row">
          <span class="hg-time">${String(r.h).padStart(2,'0')}:00</span>
          <div class="hg-bars">
            <div class="hg-bar-row">
              <div class="hg-bar-bg"><div class="hg-bar-fill" style="width:${Math.min((r.mm/maxMm)*100,100)}%;background:var(--mid)"></div></div>
              <span class="hg-mm" style="color:var(--mid)">${r.mm.toFixed(1)} mm</span>
            </div>
          </div>
        </div>`).join('')}
      `).join('')}
    </div>` : `<div class="no-rain">☀️ Ingen nedbør forventet denne dag</div>`;

  return `<div class="exp-inner">${chart}
    <div class="pills">
      <div class="pill"><div class="pill-l">Gns. total</div><div class="pill-v">${avgTotal.toFixed(1)} mm</div></div>
      <div class="pill"><div class="pill-l">Sandsynlighed</div><div class="pill-v">${prob!=null?prob+'%':'–'}</div></div>
      <div class="pill"><div class="pill-l">Gns. maks/time</div><div class="pill-v">${Math.max(...avgHrs.map(x=>x.mm)).toFixed(1)} mm</div></div>
      ${hasRain?`<div class="pill"><div class="pill-l">Timer m. regn</div><div class="pill-v">${wet.length} t</div></div>`:''}
    </div>
  </div>`;
}

function render() {
  const d0 = allData[0].daily;

  // Build dominant wmo (most rain = worst code)
  const wmos = d0.time.map((_,i) => {
    const codes = POINTS.map((_,pi) => allData[pi].daily.weathercode[i]);
    return codes.reduce((worst, c) => c > worst ? c : worst, 0);
  });

  const html = `<div class="days">${d0.time.slice(0,12).map((date,i) => {
    const obj = new Date(date);
    const today = isToday(date);
    const isOpen = i===openIdx;
    const totals = POINTS.map((_,pi) => allData[pi].daily.precipitation_sum[i]);
    const avgTotal = totals.reduce((s,v)=>s+v,0)/totals.length;
    const prob = allData[0].daily.precipitation_probability_max[i];

    const rainStrip = `<span class="rs-item">
      <span style="font-family:'DM Mono',monospace;font-size:13px;font-weight:600;color:${avgTotal>=0.1?'var(--mid)':'var(--grey)'}">
        ${avgTotal<0.1?'–':avgTotal.toFixed(1)+' mm'}
      </span>
      ${prob!=null&&avgTotal>=0.1?`<span style="font-size:10px;color:var(--grey);margin-left:4px">${prob}%</span>`:''}
    </span>`;

    return `<div class="day-card${isOpen?' open':''}" id="dc-${i}">
      <div class="day-head" data-i="${i}">
        <div>
          <div class="dn${today?' today':''}">${today?'I dag':DAYS[obj.getDay()]}</div>
          <div class="dd">${obj.getDate()}. ${MONTHS[obj.getMonth()]}</div>
        </div>
        <div class="di">${wmoIcon(wmos[i])}</div>
        <div style="display:flex;flex-direction:column;align-items:flex-end">
          <div style="font-family:'DM Mono',monospace;font-size:13px;font-weight:600">${Math.round(allData[0].daily.temperature_2m_max[i])}°</div>
          <div style="font-family:'DM Mono',monospace;font-size:10px;color:var(--grey)">/ ${Math.round(allData[0].daily.temperature_2m_min[i])}°</div>
        </div>
        <div class="chev">▾</div>
      </div>
      <div class="rain-strip">${rainStrip}</div>
      <div class="expand" id="exp-${i}">${isOpen?buildExpand(i):''}</div>
    </div>`;
  }).join('')}</div>`;

  document.getElementById('content').innerHTML = html;

  document.querySelectorAll('.day-head').forEach(hd => hd.addEventListener('click', () => {
    const i = parseInt(hd.dataset.i);
    openIdx = openIdx===i ? -1 : i;
    document.querySelectorAll('.day-card').forEach((el,j) => {
      el.classList.toggle('open', j===openIdx);
      if (j===openIdx) document.getElementById('exp-'+j).innerHTML = buildExpand(j);
    });
  }));
}

async function loadAll() {
  document.getElementById('content').innerHTML = '<div class="state"><div class="spinner"></div><h2>Henter vejrdata…</h2><p>Tre punkter</p></div>';
  try {
    allData = [];
    for (const pt of POINTS) {
      if (allData.length > 0) await sleep(600);
      allData.push(await fetchPoint(pt));
    }
    const now = new Date();
    document.getElementById('updated').textContent = 'Opdateret ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    render();
  } catch(e) {
    document.getElementById('content').innerHTML = `<div class="state"><h2>Kunne ikke hente data</h2><p>${e.message}</p></div>`;
  }
}

loadAll();
</script>
</body>
</html>
