<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://api.open-meteo.com; img-src 'self' data:;">
<title>LandslejrVejr</title>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#003255; --fdf:#5F8CB4; --sea:#4678C8;
  --grey:#7D878C; --bg:#edf2f7; --card:#f5f8fc;
  --card2:#dce8f4; --border:rgba(0,50,85,.1);
}
body{font-family:'Work Sans',sans-serif;background:var(--bg);color:var(--blue);min-height:100vh}
.shell{max-width:680px;margin:0 auto;padding:0 1rem 5rem}

/* header */
header{padding:1.3rem 0 1rem;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid rgba(0,50,85,.14);margin-bottom:1.2rem}
.logo{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;background:var(--blue);color:#fff;font-size:11px;font-weight:800;clip-path:polygon(0 0,100% 0,100% 70%,50% 100%,0 70%);flex-shrink:0}
.site-name{font-size:18px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.site-sub{font-size:11px;color:var(--grey);margin-top:2px}
.updated{font-size:11px;color:var(--grey);font-family:'DM Mono',monospace}

/* loading / error */
.state{text-align:center;padding:4rem 0}
.state h2{font-size:17px;font-weight:700;margin-bottom:.4rem}
.state p{font-size:13px;color:#1a4a6b}
.spinner{width:26px;height:26px;border:2px solid rgba(0,50,85,.15);border-top-color:var(--fdf);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto .8rem}
@keyframes spin{to{transform:rotate(360deg)}}

/* point selector */
.pts-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.1rem}
.pt-btn{font-size:12px;font-weight:700;padding:5px 14px;border-radius:20px;border:1.5px solid rgba(0,50,85,.18);background:var(--card);color:#1a4a6b;cursor:pointer;transition:all .15s}
.pt-btn:hover{background:var(--card2);border-color:var(--fdf)}
.pt-btn.active{background:var(--fdf);color:#fff;border-color:var(--fdf)}

/* days list */
.days{display:flex;flex-direction:column;gap:5px}

/* day card */
.day-card{background:var(--card);border:1.5px solid var(--border);border-radius:14px;overflow:hidden;transition:border-color .15s}
.day-card.open{border-color:var(--fdf)}
.day-head{display:grid;grid-template-columns:1fr 30px 80px 64px 18px;align-items:center;gap:8px;padding:.7rem .9rem;cursor:pointer}
.day-head:hover{background:rgba(0,50,85,.03)}
.day-card.open .day-head{background:rgba(0,50,85,.04)}
.dn{font-size:14px;font-weight:700}
.dn.today{color:var(--fdf)}
.dd{font-size:11px;color:var(--grey);font-family:'DM Mono',monospace;margin-top:1px}
.di{font-size:21px;text-align:center}
.dt{text-align:right}
.dtmax{font-family:'DM Mono',monospace;font-size:14px;font-weight:600}
.dtmin{font-family:'DM Mono',monospace;font-size:10px;color:var(--grey)}
.dp{text-align:right}
.dpv{font-family:'DM Mono',monospace;font-size:13px;font-weight:600;color:var(--sea)}
.dpv.dry{color:var(--grey)}
.dpprob{font-size:10px;color:var(--grey)}
.chev{font-size:11px;color:var(--grey);text-align:center;transition:transform .25s}
.day-card.open .chev{transform:rotate(180deg)}

/* expand */
.expand{overflow:hidden;max-height:0;transition:max-height .3s ease}
.day-card.open .expand{max-height:600px}
.exp-inner{padding:.8rem .9rem 1rem;border-top:1px solid rgba(0,50,85,.08)}

/* rain bars */
.exp-label{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--grey);margin-bottom:7px}
.bars{display:flex;align-items:flex-end;gap:4px;height:68px;margin-bottom:3px}
.bar-w{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:24px;cursor:default;position:relative}
.bar-w:hover .tip{display:block}
.tip{display:none;position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--blue);color:#fff;font-size:9px;padding:3px 6px;border-radius:5px;white-space:nowrap;font-family:'DM Mono',monospace;z-index:10;pointer-events:none}
.bar{width:100%;border-radius:3px 3px 0 0}
.xlbls{display:flex;gap:4px;margin-bottom:12px}
.xlbl{flex:1;text-align:center;font-size:9px;color:var(--grey);font-family:'DM Mono',monospace;min-width:24px}

/* rain list */
.rain-list{}
.rain-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(0,50,85,.06)}
.rain-row:last-child{border-bottom:none}
.rtime{font-family:'DM Mono',monospace;font-size:13px;font-weight:600;min-width:44px}
.rbar-bg{flex:1;height:8px;background:rgba(0,50,85,.07);border-radius:4px;overflow:hidden}
.rbar-fill{height:100%;border-radius:4px;background:var(--sea)}
.rmm{font-family:'DM Mono',monospace;font-size:12px;color:var(--sea);min-width:46px;text-align:right}
.rdesc{font-size:11px;color:var(--grey);min-width:58px;text-align:right}

/* no rain */
.no-rain{text-align:center;padding:.9rem 0;color:var(--grey);font-size:13px}

/* pills */
.pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.pill{background:rgba(70,120,200,.08);border:1px solid rgba(70,120,200,.15);border-radius:8px;padding:4px 9px;text-align:center}
.pill-l{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--grey);margin-bottom:2px}
.pill-v{font-family:'DM Mono',monospace;font-size:13px;font-weight:600}

@media(max-width:480px){
  .day-head{grid-template-columns:1fr 28px 70px 56px 16px;gap:5px;padding:.65rem .7rem}
}
</style>
</head>
<body>
<div class="shell">
<header>
  <div>
    <div class="site-name"><span class="logo">LV</span> LandslejrVejr</div>
    <div class="site-sub">Vejrudsigt · 12 dage frem</div>
  </div>
  <div class="updated" id="updated">—</div>
</header>
<div class="pts-row" id="ptsRow"></div>
<div id="content"><div class="state"><div class="spinner"></div><h2>Henter vejrdata…</h2></div></div>
</div>

<script>
const POINTS = [
  { id:'p1', label:'P1', lat:56.120603, lon:9.681001 },
  { id:'p2', label:'P2', lat:56.104814, lon:9.651731 },
  { id:'p3', label:'P3', lat:56.119284, lon:9.647719 },
];

const WMO = {0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',71:'🌨️',73:'🌨️',75:'❄️',77:'🌨️',80:'🌦️',81:'🌧️',82:'⛈️',85:'🌨️',86:'❄️',95:'⛈️',96:'⛈️',99:'⛈️'};
const DAYS = ['Søndag','Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag'];
const MONTHS = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];

const wmoIcon = c => WMO[c]||'🌡️';
const isToday = s => { const d=new Date(s),t=new Date(); return d.getDate()===t.getDate()&&d.getMonth()===t.getMonth()&&d.getFullYear()===t.getFullYear(); };
const rainColor = mm => { if(!mm||mm<0.05)return'rgba(70,120,200,.1)'; if(mm<0.5)return'rgba(70,120,200,.35)'; if(mm<2)return'rgba(70,120,200,.65)'; if(mm<5)return'#4678C8'; return'#003255'; };
const rainDesc = mm => { if(!mm||mm<0.1)return'Tørt'; if(mm<0.5)return'Dug'; if(mm<2)return'Let regn'; if(mm<5)return'Regn'; if(mm<10)return'Kraftig'; return'Styrtregn'; };

// State
let activeId = 'p1';
const cache = {};
let openIdx = 0;

// Build point selector
function buildPts() {
  document.getElementById('ptsRow').innerHTML = POINTS.map(p =>
    `<button class="pt-btn${p.id===activeId?' active':''}" data-id="${p.id}">${p.label}</button>`
  ).join('');
  document.querySelectorAll('.pt-btn').forEach(b => b.addEventListener('click', () => {
    activeId = b.dataset.id;
    buildPts();
    loadPoint();
  }));
}

// Fetch
async function fetchPoint(pt) {
  if (cache[pt.id]) return cache[pt.id];
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${pt.lat}&longitude=${pt.lon}`
    + `&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max`
    + `&hourly=precipitation`
    + `&wind_speed_unit=ms&forecast_days=14&timezone=Europe%2FCopenhagen`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('API fejl ' + r.status);
  cache[pt.id] = await r.json();
  return cache[pt.id];
}

// Render
function buildExpand(hrs, total, prob) {
  const wet = hrs.filter(x => x.mm >= 0.05);
  const hasRain = total >= 0.1;
  const maxMm = Math.max(...wet.map(x => x.mm), 0.5);
  const maxHourly = Math.max(...hrs.map(x => x.mm), 0);

  // group consecutive wet hours
  const groups = [];
  wet.forEach(r => {
    const last = groups[groups.length-1];
    if (last && r.h - last[last.length-1].h <= 2) last.push(r);
    else groups.push([r]);
  });

  const chart = hasRain ? `
    <div class="exp-label">Nedbør · kun timer med regn</div>
    <div class="bars">
      ${wet.map(r => {
        const bh = Math.max((r.mm/maxMm)*90, 6);
        return `<div class="bar-w"><div class="tip">${r.h}:00 · ${r.mm.toFixed(1)} mm</div><div class="bar" style="height:${bh}%;background:${rainColor(r.mm)}"></div></div>`;
      }).join('')}
    </div>
    <div class="xlbls">${wet.map(r=>`<div class="xlbl">${r.h}h</div>`).join('')}</div>
    <div class="exp-label">Tidspunkter</div>
    <div class="rain-list">
      ${groups.map(grp => `
        ${grp.length>1?`<div style="font-size:10px;color:var(--grey);margin:5px 0 2px">${String(grp[0].h).padStart(2,'0')}:00 – ${String(grp[grp.length-1].h).padStart(2,'0')}:59</div>`:''}
        ${grp.map(r=>`<div class="rain-row">
          <span class="rtime">${String(r.h).padStart(2,'0')}:00</span>
          <div class="rbar-bg"><div class="rbar-fill" style="width:${Math.min((r.mm/maxMm)*100,100)}%"></div></div>
          <span class="rmm">${r.mm.toFixed(1)} mm</span>
          <span class="rdesc">${rainDesc(r.mm)}</span>
        </div>`).join('')}
      `).join('')}
    </div>` : `<div class="no-rain">☀️ Ingen nedbør forventet</div>`;

  return `<div class="exp-inner">${chart}
    <div class="pills">
      <div class="pill"><div class="pill-l">Total</div><div class="pill-v">${total.toFixed(1)} mm</div></div>
      <div class="pill"><div class="pill-l">Sandsynlighed</div><div class="pill-v">${prob!=null?prob+'%':'–'}</div></div>
      <div class="pill"><div class="pill-l">Maks/time</div><div class="pill-v">${maxHourly.toFixed(1)} mm</div></div>
      ${hasRain?`<div class="pill"><div class="pill-l">Timer m. regn</div><div class="pill-v">${wet.length} t</div></div>`:''}
    </div>
  </div>`;
}

function render(data) {
  const d = data.daily;
  const h = data.hourly.precipitation;

  const html = `<div class="days">${d.time.slice(0,12).map((date,i) => {
    const obj = new Date(date);
    const today = isToday(date);
    const total = d.precipitation_sum[i];
    const prob = d.precipitation_probability_max[i];
    const hrs = Array.from({length:24},(_,j)=>({h:j, mm: h[i*24+j]||0}));
    const isOpen = i===openIdx;

    return `<div class="day-card${isOpen?' open':''}" id="dc-${i}">
      <div class="day-head" data-i="${i}">
        <div>
          <div class="dn${today?' today':''}">${today?'I dag':DAYS[obj.getDay()]}</div>
          <div class="dd">${obj.getDate()}. ${MONTHS[obj.getMonth()]}</div>
        </div>
        <div class="di">${wmoIcon(d.weathercode[i])}</div>
        <div class="dt">
          <div class="dtmax">${Math.round(d.temperature_2m_max[i])}°</div>
          <div class="dtmin">/ ${Math.round(d.temperature_2m_min[i])}°</div>
        </div>
        <div class="dp">
          <div class="dpv${total<0.1?' dry':''}">${total<0.1?'–':total.toFixed(1)+' mm'}</div>
          ${prob!=null&&total>=0.1?`<div class="dpprob">${prob}%</div>`:''}
        </div>
        <div class="chev">▾</div>
      </div>
      <div class="expand" id="exp-${i}">
        ${isOpen ? buildExpand(hrs, total, prob) : ''}
      </div>
    </div>`;
  }).join('')}</div>`;

  document.getElementById('content').innerHTML = html;

  document.querySelectorAll('.day-head').forEach(h => h.addEventListener('click', () => {
    const i = parseInt(h.dataset.i);
    if (openIdx === i) { openIdx = -1; }
    else {
      openIdx = i;
      // Lazy-render expand content
      const exp = document.getElementById('exp-'+i);
      const date = d.time[i];
      const total = d.precipitation_sum[i];
      const prob = d.precipitation_probability_max[i];
      const hrs = Array.from({length:24},(_,j)=>({h:j, mm: data.hourly.precipitation[i*24+j]||0}));
      exp.innerHTML = buildExpand(hrs, total, prob);
    }
    document.querySelectorAll('.day-card').forEach((el,j) => el.classList.toggle('open', j===openIdx));
  }));
}

async function loadPoint() {
  openIdx = 0;
  document.getElementById('content').innerHTML = '<div class="state"><div class="spinner"></div><h2>Henter vejrdata…</h2></div>';
  const pt = POINTS.find(p => p.id === activeId);
  try {
    const data = await fetchPoint(pt);
    const now = new Date();
    document.getElementById('updated').textContent = 'Opdateret ' + now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0');
    render(data);
  } catch(e) {
    document.getElementById('content').innerHTML = `<div class="state"><h2>Kunne ikke hente data</h2><p>${e.message}</p></div>`;
  }
}

buildPts();
loadPoint();
</script>
</body>
</html>
